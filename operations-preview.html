<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>งานหน้าร้าน — ตัวอย่างหน้าจอ</title><style>body{margin:0;background:#f4f6f9;color:#172033;font-family:system-ui,'Noto Sans Thai',sans-serif}header{background:#14243c;color:white;padding:18px}main{max-width:850px;margin:auto;padding:18px}.warn{background:#fff3d8;padding:12px;border-radius:12px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.panel{border:1px solid #e2e8f0;background:white;border-radius:16px;padding:18px}.tile{text-align:left;font-weight:750;font-size:18px;min-height:115px;cursor:pointer}.tile small{display:block;font-size:13px;color:#64748b;font-weight:400;margin-top:8px}.panel{margin-top:16px}label{display:block;margin-top:12px;font-weight:600}input,select{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{font:inherit}.primary{background:#176c46;color:white;border:0;border-radius:10px;padding:13px 20px;margin-top:15px;cursor:pointer}.secondary{background:#e2e8f0;border:0;border-radius:10px;padding:10px;margin-top:12px}.muted{color:#64748b}.hidden{display:none}.result{padding:12px;background:#e8f5ec;border-radius:12px;margin-top:14px}a{color:inherit}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>ร้านค้าสวัสดิการ · งานหน้าร้าน</strong><div><a href="./index.html">← กลับหน้าขายสินค้า</a></div></header><main><div class="warn"><strong>หน้าทดลองขั้นตอนการทำงาน</strong> — ยังไม่บันทึกเงินจริง ไม่เชื่อม Supabase และไม่ใช่หลักฐานรับจ่ายเงิน ห้ามใช้แทนสมุดบัญชีจนกว่าระบบจริงจะเปิดใช้งาน</div><h2>วันนี้ต้องทำอะไร?</h2><div class="grid"><button class="tile" data-kind="drawer">💵 เงินสด / ปิดกะ<small>เปิดกะ นับเงิน ตรวจผลต่าง</small></button><button class="tile" data-kind="temple">🙏 เบิกจ่ายให้วัด<small>สำรองซื้อของ เบิกค่าแรง เคลียร์วัด</small></button><button class="tile" data-kind="parcel">📦 พัสดุ COD<small>ออกเงินให้ก่อน ติดตามคืนเงินรายคน</small></button><button class="tile" data-kind="exchange">🔁 สแกนแลกเงินสด<small>คิดค่าบริการและยอดเงินที่ต้องจ่าย</small></button></div><section id="workspace" class="panel hidden"><h2 id="heading"></h2><p class="muted" id="help"></p><div id="fields"></div><button id="calculate" class="primary">ตรวจสอบตัวอย่าง</button><div id="result" class="result hidden" role="status"></div></section></main><script>const $=s=>document.querySelector(s);const money=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาท';const configs={drawer:{title:'เงินสดและปิดกะ',help:'นับเงินจริงก่อนดูยอดที่ระบบคำนวณ (ระบบจริงจะล็อกยอดนับและบันทึกผู้ตรวจนับ)',fields:[['opening','เงินตั้งต้นวันนี้','number'],['count','เงินที่นับได้จริง','number']]},temple:{title:'เบิกจ่ายให้วัด',help:'เลือกประเภทการเบิกและผู้รับเงิน โดยแยกจากยอดขายร้าน',fields:[['kind','ประเภท','select','สำรองซื้อของ|จ่ายค่าแรง|เบิกค่าแรงล่วงหน้า'],['person','ชื่อผู้เบิก','text'],['amount','จำนวนเงินที่จ่าย','number'],['purpose','เหตุผล / ซื้ออะไร','text']]},parcel:{title:'พัสดุ COD',help:'บันทึกเฉพาะพัสดุที่ร้านออกเงินให้ก่อน ไม่จำกัดวงเงิน และไม่รวมยอดเคลียร์วัด',fields:[['person','เจ้าของพัสดุ','text'],['tracking','เลขพัสดุ (ถ้ามี)','text'],['amount','ยอดที่ร้านสำรองจ่าย','number'],['repaid','เงินที่เจ้าของคืนแล้ว','number']]},exchange:{title:'สแกนแลกเงินสด',help:'คิดค่าบริการตามยอดเงินสดที่ลูกค้ารับ: 1–500 บาท ค่าบริการ 20 บาท; มากกว่า 500–1,000 บาท ค่าบริการ 30 บาท',fields:[['amount','เงินสดที่ลูกค้าต้องการรับ','number']]}};let active='';document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{active=b.dataset.kind;const c=configs[active];$('#workspace').classList.remove('hidden');$('#heading').textContent=c.title;$('#help').textContent=c.help;$('#result').classList.add('hidden');$('#fields').innerHTML=c.fields.map(([id,label,type,options])=>'<label for="'+id+'">'+label+'</label>'+(type==='select'?'<select id="'+id+'">'+options.split('|').map(v=>'<option>'+v+'</option>').join('')+'</select>':'<input id="'+id+'" type="'+type+'" '+(type==='number'?'min="0" step="0.01" inputmode="decimal"':'')+'>')).join('');$('#workspace').scrollIntoView({behavior:'smooth',block:'start'})});$('#calculate').onclick=()=>{const val=id=>Number($('#'+id)?.value),positive=id=>Number.isFinite(val(id))&&val(id)>0;let msg='';if(active==='drawer'){if(!Number.isFinite(val('opening'))||val('opening')<0||!Number.isFinite(val('count'))||val('count')<0)msg='กรอกจำนวนเงินให้ถูกต้อง';else msg='ยอดนับจริง '+money(val('count'))+' — ระบบจริงจะแสดงยอดที่ควรมีหลังบันทึกการนับครั้งแรกสำเร็จเท่านั้น'}if(active==='temple')msg=!$('#person').value.trim()||!$('#purpose').value.trim()||!positive('amount')?'กรอกชื่อผู้เบิก เหตุผล และจำนวนเงินให้ครบ':'ตัวอย่างใบเบิก: '+$('#person').value.trim()+' · '+$('#kind').value+' · '+money(val('amount'))+' (ยังไม่ได้จ่ายเงินจริงหรือบันทึกข้อมูล)';if(active==='parcel')msg=!$('#person').value.trim()||!positive('amount')||val('repaid')<0||val('repaid')>val('amount')?'ตรวจสอบชื่อเจ้าของพัสดุ ยอด COD และยอดคืน':'ยอดค้างของพัสดุนี้ '+money(val('amount')-val('repaid'))+' (ตัวอย่าง ไม่รวมพัสดุอื่น)';if(active==='exchange'){let a=val('amount');msg=!positive('amount')||a>1000?'รองรับเงินสด 1–1,000 บาท':('ลูกค้าต้องโอน '+money(a+(a<=500?20:30))+' · ร้านจ่ายเงินสด '+money(a)+' · ค่าบริการ '+money(a<=500?20:30)+' (ต้องตรวจสอบเงินเข้าจริงก่อนจ่าย)')}$('#result').textContent=msg;$('#result').classList.remove('hidden')};</script></body></html>
